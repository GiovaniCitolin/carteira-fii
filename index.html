<!DOCTYPE html><html lang='pt-BR'><head>
<meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<link rel='stylesheet' href='css/style.css'><title>Carteira FII V2.1 Sprint2</title></head>
<body>
<header class='topo'><h1>Carteira FII</h1><button class='avatar'>👤</button></header>

<section class='dashboard'>
<div class='box'><small>Investido</small><h2 id='totalInvestido'>R$ 0,00</h2></div>
<div class='box'><small>Dividendos</small><h2 id='totalRendimentos'>R$ 0,00</h2></div>
</section>

<input class='search' placeholder='🔍 Pesquisar fundo...'>

<div class='card'>
<div class='head'><b>HGLG11</b><button class='menu'>⋮</button></div>
<p>57 cotas</p>
<p>Investido: R$ 9.850,00</p>
<div class='actions'>
<button>✏️ Editar</button>
<button class='danger'>🗑 Excluir</button>
</div>
</div>

<button class='fab'>+</button>

<nav class='bottom'>
<button>🏠</button><button>📊</button><button>➕</button><button>⚙️</button>
</nav>
<script src='js/app.js'></script>
</body></html>
