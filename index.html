<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Carteira FII</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#f4f6fb">

</head>

<body>

<header class="topo">

    <h1>Carteira FII</h1>

    <p>Controle dos seus investimentos</p>

</header>

<div class="container">

<div class="dashboard">

    <div class="resumo">

        <span>Total Investido</span>

        <h2 id="totalInvestido">
            R$ 0,00
        </h2>

    </div>

    <div class="linha"></div>

    <div class="resumo">

        <span>Dividendos Recebidos</span>

        <h2 id="totalRendimentos">
            R$ 0,00
        </h2>

    </div>

</div>

<div class="card">

<h3>Novo Aporte</h3>

<select id="fundo"></select>
<input id="novoFundo" type="text" placeholder="Novo ticker" style="display:none;">

<input
id="cotas"
type="number"
placeholder="Quantidade">

<input
id="valor"
type="number"
step="0.01"
placeholder="Preço da Cota">

<input
id="data"
type="date">

<button onclick="salvarAporte()">

Salvar Aporte

</button>

</div>

<div class="card">

<h3>Novo Rendimento</h3>

<select id="fundoRendimento"></select>
<input id="novoFundoRendimento" type="text" placeholder="Novo ticker" style="display:none;">

<input
id="mes"
type="month">

<input
id="rendimento"
type="number"
step="0.01"
placeholder="Valor recebido">

<button onclick="salvarRendimento()">

Salvar Rendimento

</button>

</div>



<button class="historico" onclick="document.getElementById('painelCadastros').classList.toggle('mostrar')">
📂 Mostrar / Ocultar Fundos e Rendimentos
</button>

<div id="painelCadastros" class="painel-oculto">

<div class="card">
<h3>Meus Aportes</h3>
<div id="listaFundos"></div>
</div>

<div class="card">
<h3>Rendimentos</h3>
<div id="listaRendimentos"></div>
</div>

</div>

<button
class="historico"
onclick="location.href='historico.html'">

Ver Histórico

</button>

</div>

<script src="app.js"></script>

<script>

inicializarFundos();
carregarListaFundos();

carregarListaRendimentos();

atualizarResumo();

</script>

</body>

</html>
