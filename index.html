<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carteira FII v2</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topo">
<h1>Carteira FII</h1>
<p>Layout V2 inspirado em apps financeiros</p>
</header>

<div class="container">
<div class="dashboard">
<div><small>Total Investido</small><h2 id="totalInvestido">R$ 0,00</h2></div>
<div><small>Dividendos</small><h2 id="totalRendimentos">R$ 0,00</h2></div>
</div>

<div class="search-box">
<input id="pesquisa" placeholder="🔍 Pesquisar fundo">
</div>

<div class="card" id="listaFundos">
<p>Os cards dos fundos aparecerão aqui.</p>
</div>

<button id="fab">+</button>

<nav class="bottom-nav">
<button>🏠<br>Início</button>
<button>📊<br>Histórico</button>
<button>⚙️<br>Config.</button>
</nav>
</div>
<script src="js/app.js"></script>
</body>
</html>
