<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Carteira FII</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#f4f6fb">

</head>

<body>

<header class="topo">

    <h1>Carteira FII</h1>

    <p>Controle dos seus investimentos</p>

</header>

<div class="container">

<div class="dashboard">

    <div class="resumo">

        <span>Total Investido</span>

        <h2 id="totalInvestido">
            R$ 0,00
        </h2>

    </div>

    <div class="linha"></div>

    <div class="resumo">

        <span>Dividendos Recebidos</span>

        <h2 id="totalRendimentos">
            R$ 0,00
        </h2>

    </div>

</div>

<div class="card">

<h3>Novo Aporte</h3>

<input
id="fundo"
type="text"
placeholder="Ticker (MXRF11)">

<input
id="cotas"
type="number"
placeholder="Quantidade">

<input
id="valor"
type="number"
step="0.01"
placeholder="Preço da Cota">

<input
id="data"
type="date">

<button onclick="salvarAporte()">

Salvar Aporte

</button>

</div>

<div class="card">

<h3>Novo Rendimento</h3>

<input
id="fundoRendimento"
type="text"
placeholder="Ticker">

<input
id="mes"
type="month">

<input
id="rendimento"
type="number"
step="0.01"
placeholder="Valor recebido">

<button onclick="salvarRendimento()">

Salvar Rendimento

</button>

</div>

<div class="card">
<div class="search-box">

<input
id="pesquisa"
type="text"
placeholder="🔍 Pesquisar fundo..."
onkeyup="carregarListaFundos()">

</div>

<h3>Fundos Cadastrados</h3>

<div id="listaFundos"></div>

</div>

<div class="card">

<h3>Rendimentos</h3>

<div id="listaRendimentos"></div>

</div>

<button
class="historico"
onclick="location.href='historico.html'">

Ver Histórico

</button>

</div>

<script src="app.js"></script>

<script>

carregarListaFundos();

carregarListaRendimentos();

atualizarResumo();

</script>

</body>

</html>
